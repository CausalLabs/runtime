plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.httpcomponents.client5:httpclient5:5.6.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.21.4'
    // don't use the $avroversion variable here, it breaks the build
    api ("org.apache.avro:avro:1.12.0") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.dataformat'
        exclude group: 'org.codehaus.jackson'
    }
    api 'org.slf4j:slf4j-api:2.0.17'
}

compileJava {
    options.release = 17
}

java {
   toolchain {
    languageVersion.set(JavaLanguageVersion.of(17))
   }
    withJavadocJar()
    withSourcesJar()
}

javadoc {
}


publishing {
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
    repositories {
        maven {
            url = uri("s3://maven.causallabs.io/")
            authentication {
              awsIm(AwsImAuthentication)
            }
        }
    }
}
