plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.httpcomponents.client5:httpclient5:5.6.1'
    // httpclient5 5.6.1 brings httpcore5 5.4, which carries CVE-2026-54399 and CVE-2026-54428
    // (both resource exhaustion). Fixed in 5.4.3. Direct api deps for the same reason as
    // commons-lang3 below -- this module is published, so it has to land in POM <dependencies>.
    api 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
    api 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
    // CVE-2026-59889: @JsonView bypassed for @JsonUnwrapped container properties.
    api 'com.fasterxml.jackson.core:jackson-databind:2.21.6'
    // don't use the $avroversion variable here, it breaks the build
    api ("org.apache.avro:avro:1.12.0") {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.dataformat'
        exclude group: 'org.codehaus.jackson'
    }
    api 'org.slf4j:slf4j-api:2.0.17'

    // Security vulnerability fix: uncontrolled recursion, SNYK-JAVA-ORGAPACHECOMMONS-10734078.
    // avro:1.12.0 -> commons-compress:1.26.2 otherwise drags in 3.14.0, below the 3.18.0 fix.
    //
    // This is a DIRECT api dependency rather than a `constraints` block on purpose. This module
    // publishes to s3://maven.causallabs.io/, and a constraint reaches external consumers only
    // as a POM <dependencyManagement> entry -- which Maven does NOT inherit from a dependency's
    // POM. A Gradle consumer would be protected by the .module metadata; a Maven consumer would
    // silently resolve 3.14.0 again. Declaring it directly puts it in <dependencies>, where
    // Maven's nearest-wins and Gradle's highest-wins both land on 3.20.0.
    //
    // Guarded by :runtime:verifyPublishedPom.
    api 'org.apache.commons:commons-lang3:3.20.0'
}

compileJava {
    options.release = 17
}

java {
   toolchain {
    languageVersion.set(JavaLanguageVersion.of(17))
   }
    withJavadocJar()
    withSourcesJar()
}

javadoc {
}


publishing {
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
    repositories {
        maven {
            url = uri("s3://maven.causallabs.io/")
            authentication {
              awsIm(AwsImAuthentication)
            }
        }
    }
}
